# Release workflow: builds both legacy (Gradle 7.3.1 / Java 17) and modern
# (Gradle 8.10.2 / Java 21) module sets, then uploads every produced jar to
# the GitHub release. CI_VERSION is forwarded so build-1.21.1.gradle / build.gradle
# can override `mod_version` from the tag ref.

name: release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 for legacy modules
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build legacy modules (1.15.2-1.18)
        env:
          CI_VERSION: ${{ github.ref }}
        run: ./gradlew build

      - name: Set up JDK 21 for 1.21.1 modules
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew-1.21.1
        run: chmod +x gradlew-1.21.1

      - name: Build 1.21.1 modules
        env:
          CI_VERSION: ${{ github.ref }}
        run: >
          ./gradlew-1.21.1
          :common-1.21.1:build
          :fabric-1.21.1:build
          :neoforge-1.21.1:build
          --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            */build/libs/*
            *-1.21.1/build/libs/*

      - uses: AButler/upload-release-assets@v2.0
        with:
          files: '*/build/libs/*;*-1.21.1/build/libs/*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
