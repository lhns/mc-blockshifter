// fabric-loom and de.lhns.mcdp come from the root build.gradle plugins{} block (with
// `apply false`) so the plugin classloader is shared with :1.21.1:neoforge.
apply plugin: 'fabric-loom'
apply plugin: 'de.lhns.mcdp'

def commonProject = project(':1.21.1:common')

repositories {
    // mcdp (`de.lhns.mcdp:mcdp`) — release versions live on Maven Central, SNAPSHOTs on
    // the Sonatype Central Portal snapshots repo. Both kept available so `mcdp_version`
    // in root gradle.properties can flip between them without repo edits.
    mavenCentral()
    maven {
        name = 'sonatype-central-snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.parent.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parent.parchment_minecraft}:${project.parent.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.parent.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.parent.fabric_api_version}"

    // mcdp unified runtime adapter (ADR-0016) — single jar bundles both Fabric and NeoForge
    // adapters. Provides the `mcdepprovider` LanguageAdapter referenced in fabric.mod.json
    // and the per-mod URLClassLoader that serves scala-library at runtime. Auto Mixin →
    // mod-private bridge codegen (ADR-0018) is on by default.
    modImplementation "de.lhns.mcdp:mcdp:${project.parent.mcdp_version}"

    // Scala stdlib goes through mcdp's per-mod loader instead of being shaded into the jar.
    // The Gradle plugin emits this into META-INF/mcdepprovider.toml.
    mcdepImplementation "org.scala-lang:scala-library:${project.parent.scala_library_version}"
}

mcdepprovider {
    lang.set('scala')
    // Override the auto-derived bridge package: mcdp's default builds it as
    //   <group>.<projectName.replace('-','_')>.mcdp_mixin_bridges
    // For projectName "fabric" under parent "1.21.1" the leading numeric segment makes
    // some derived names invalid Java identifiers. Pin a valid identifier explicitly.
    bridges {
        bridgePackage.set('de.lolhens.minecraft.blockshifter.fabric.mcdp_bridges')
    }
}

sourceSets {
    main {
        scala.srcDirs += commonProject.file('src/main/scala')
        resources.srcDirs += commonProject.file('src/main/resources')
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

loom {
    mixin {
        defaultRefmapName = 'blockshifter.refmap.json'
    }
}
