plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'de.lhns.mcdp'
}

def commonProject = project(':1.21.1:common')

repositories {
    // mcdp-fabric runtime adapter is published as a shadow jar to mavenLocal
    // by mc-scala (composite substitution doesn't flow through to it).
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.parent.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parent.parchment_minecraft}:${project.parent.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.parent.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.parent.fabric_api_version}"

    // mcdp Fabric runtime adapter — provides the `mcdepprovider` LanguageAdapter
    // and the per-mod URLClassLoader that serves scala-library at runtime.
    modImplementation "de.lhns.mcdp:mcdp-fabric:${project.parent.mcdp_version}"

    // Scala stdlib goes through mcdp's per-mod loader instead of being shaded
    // into the jar. The Gradle plugin emits these into META-INF/mcdepprovider.toml.
    mcdepImplementation "org.scala-lang:scala-library:${project.parent.scala_library_version}"
}

mcdepprovider {
    lang.set('scala')
}

sourceSets {
    main {
        scala.srcDirs += commonProject.file('src/main/scala')
        resources.srcDirs += commonProject.file('src/main/resources')
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

loom {
    mixin {
        defaultRefmapName = 'blockshifter.refmap.json'
    }
}
