plugins {
    id 'net.neoforged.moddev' version '2.0.91'
    id 'de.lhns.mcdp'
}

def commonProject = project(':1.21.1:common')

repositories {
    // mcdp-neoforge runtime adapter — published as a shadow jar to mavenLocal
    // by mc-scala. Run before building:
    //   ../mc-scala/gradlew :neoforge:publishToMavenLocal
    mavenLocal()
}

neoForge {
    version = project.parent.neoforge_version
    parchment {
        minecraftVersion = project.parent.parchment_minecraft
        mappingsVersion = project.parent.parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        blockshifter {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly commonProject

    // mcdp NeoForge runtime adapter — replaces the scala-library jarJar shade.
    // Discovers @Mod-annotated classes the same way vanilla javafml does and
    // dispatches the (IEventBus) constructor.
    implementation "de.lhns.mcdp:mcdp-neoforge:${project.parent.mcdp_version}"

    mcdepImplementation "org.scala-lang:scala-library:${project.parent.scala_library_version}"
}

mcdepprovider {
    lang.set('scala')
}

sourceSets {
    main {
        scala.srcDirs += commonProject.file('src/main/scala')
        resources.srcDirs += commonProject.file('src/main/resources')
    }
}
