plugins {
    id 'net.neoforged.moddev' version '2.0.91'
    id 'java'
    id 'scala'
    id 'idea'
}

archivesBaseName = rootProject.archives_base_name
version = rootProject.version + "+common-${project.minecraft_version}"
group = rootProject.group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.encoding = 'UTF-8'
    scalaCompileOptions.additionalParameters = ['-release', '21']
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

neoForge {
    neoFormVersion = project.neo_form_version
    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }
}

dependencies {
    // Scala 3 stdlib + circe — compile-only here in :common-1.21.1; runtime delivery is
    // handled by mcdp's per-mod loader in :fabric-1.21.1 and :neoforge-1.21.1.
    compileOnly "org.scala-lang:scala3-library_3:${project.scala3_version}"
    compileOnly "org.spongepowered:mixin:0.8.5"

    compileOnly "io.circe:circe-parser_3:${project.circe_version}"
    compileOnly "io.circe:circe-generic_3:${project.circe_version}"
    compileOnly "io.circe:circe-generic-extras_3:${project.circe_extras_version}"
    compileOnly "io.circe:circe-config_3:${project.circe_config_version}"
    compileOnly "org.typelevel:cats-core_3:${project.cats_version}"
}
