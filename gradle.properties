org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.jvmargs=-Xmx6G
# Mod Properties
archives_base_name=blockshifter
mod_version=0.0.1-SNAPSHOT
maven_group=de.lolhens
mod_id=blockshifter
mod_author=LolHens

# 1.21.1 multiloader pins — legacy fabric-1.15.2..forge-1.16.4 modules ignore these
# (each has its own per-module gradle.properties that overrides where it cares about
# the same key, e.g. `minecraft_version`). Declared at root so:
#  - the shared `plugins {}` block in build-1.21.1.gradle and the `pluginManagement.plugins`
#    block in settings-1.21.1.gradle can read `mcdp_version`,
#  - all three 1.21.1 subprojects (common-, fabric-, neoforge-) read the same source of truth
#    via `project.<name>` (no parent-walk needed after the flat-naming refactor).
minecraft_version=1.21.1
neo_form_version=1.21.1-20240808.144430
parchment_minecraft=1.21.1
parchment_version=2024.11.17
neoforge_version=21.1.77
fabric_loader_version=0.16.5
fabric_api_version=0.115.0+1.21.1

# Scala 3 (LTS). Per-mod URLClassLoader served by mcdp means the version is per-mod —
# unrelated to whatever other mods or older variants of this mod use.
scala3_version=3.3.4

# circe (JSON / HOCON config) — served at runtime via mcdp's per-mod loader.
circe_version=0.14.10
circe_extras_version=0.14.5-RC1
circe_config_version=0.10.2

# cats (transitive of circe) — pinned explicitly so mcdpImplementation can resolve
# a consistent version across the closure.
cats_version=2.13.0

mcdp_version=0.1.0-SNAPSHOT
moddevgradle_version=2.0.91
