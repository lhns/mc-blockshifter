# mcdp (MC Dependency Provider) version. Declared at root so the shared `plugins {}`
# block in build.gradle and the `pluginManagement.plugins` block in settings.gradle can
# read it (per-subproject gradle.properties files aren't visible in those contexts).
# Subproject build.gradles read the same property via `project.parent.mcdp_version` /
# `project.mcdp_version`.
mcdp_version=0.1.2
