plugins {
    id 'net.neoforged.moddev' version '2.0.91'
    // de.lhns.mcdp is declared in build-1.21.1.gradle's plugins{} block (with `apply false`)
    // so the plugin classloader is shared with :fabric-1.21.1 — re-applied here without version.
    id 'de.lhns.mcdp'
    id 'java'
    id 'scala'
    id 'idea'
}

archivesBaseName = rootProject.archives_base_name
version = rootProject.version + "+neoforge-${project.minecraft_version}"
group = rootProject.group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.encoding = 'UTF-8'
    scalaCompileOptions.additionalParameters = ['-release', '21']
}

def commonProject = project(':common-1.21.1')

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    // mcdp (`de.lhns.mcdp:mcdp`) — release versions live on Maven Central, SNAPSHOTs on
    // the Sonatype Central Portal snapshots repo.
    maven {
        name = 'sonatype-central-snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

neoForge {
    version = project.neoforge_version
    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        blockshifter {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly commonProject

    // mcdp unified runtime adapter (ADR-0016) — single jar bundles both Fabric and NeoForge
    // adapters. Discovers @Mod-annotated classes via ModFileScanData.getAnnotatedBy(Mod.class)
    // like vanilla javafml, and FML's bag-based ctor dispatch (ADR-0017) accepts (), (IEventBus),
    // (ModContainer), or any subset/superset of [IEventBus, ModContainer, Dist].
    implementation "de.lhns.mcdp:mcdp:${project.mcdp_version}"

    mcdepImplementation "org.scala-lang:scala-library:${project.scala_library_version}"
}

mcdepprovider {
    lang.set('scala')
    // Override the auto-derived bridge package — see fabric-1.21.1/build.gradle for rationale.
    bridges {
        bridgePackage.set('de.lolhens.minecraft.blockshifter.neoforge.mcdp_bridges')
    }
}

sourceSets {
    main {
        scala.srcDirs += commonProject.file('src/main/scala')
        resources.srcDirs += commonProject.file('src/main/resources')
    }
}
