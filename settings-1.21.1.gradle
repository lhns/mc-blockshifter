// Alternate settings file for the Minecraft 1.21.1 modules only (Scala 2.13.14, Mojmap +
// Parchment, Fabric Loom 1.7 and ModDevGradle 2.0.91). Invoke via ./gradlew-1.21.1 which
// passes this file and points at the Gradle 8.10 wrapper under gradle-1.21.1/. The default
// settings.gradle lists the legacy 1.15.2-1.18 modules and is used by the default ./gradlew
// on Gradle 7.3.

// mcdp (MC Dependency Provider) is consumed from Maven Central / Sonatype Central Portal
// snapshots — no sibling checkout / composite-include needed. The Gradle plugin
// (`de.lhns.mcdp`) is resolved via pluginManagement; the runtime artifact
// (`de.lhns.mcdp:mcdp`) is added per-subproject in {fabric,neoforge}-1.21.1/build.gradle.
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'FabricMC'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        // mcdp's Gradle plugin (`de.lhns.mcdp`) is published to Maven Central.
        mavenCentral()
        // Sonatype Central Portal snapshots — kept alongside mavenCentral so `mcdp_version`
        // in root gradle.properties can flip between release (e.g. `0.1.2`) and snapshot
        // (e.g. `0.1.3-SNAPSHOT`) without repo edits.
        maven {
            name = 'sonatype-central-snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }

    // Pin the de.lhns.mcdp plugin version centrally so the plugins{} block in
    // build-1.21.1.gradle can reference it with `id 'de.lhns.mcdp'` (no `version` arg —
    // Gradle's plugins{} doesn't allow ${...} interpolation in version strings, but
    // pluginManagement.plugins resolves the same property without that restriction).
    plugins {
        id 'de.lhns.mcdp' version "${mcdp_version}"
    }
}

rootProject.name = 'mc-blockshifter'
// Use a separate root build file so fabric-loom + de.lhns.mcdp can be declared in a shared
// plugins {} block without colliding with the legacy build.gradle (Gradle 7.3 / ForgeGradle 5,
// which can't resolve those plugin coords).
rootProject.buildFileName = 'build-1.21.1.gradle'

include ':common-1.21.1'
include ':fabric-1.21.1'
include ':neoforge-1.21.1'
