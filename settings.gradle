// Two-wrapper build: this file is used by the default ./gradlew (Gradle 7.3.1 + Java 17)
// for the legacy 1.15.2-1.18 modules. The 1.21.1 modules use ./gradlew-1.21.1 with
// settings-1.21.1.gradle and a separate wrapper under gradle-1.21.1/.

rootProject.name = 'mc-blockshifter'

include ':fabric-1.15.2'
include ':fabric-1.16.1'
include ':fabric-1.16.2'
include ':fabric-1.16.4'
include ':fabric-1.17'
include ':fabric-1.18'
include ':forge-1.15.2'
include ':forge-1.16.1'
include ':forge-1.16.2'
include ':forge-1.16.4'

// NOTE: the :common-1.21.1, :fabric-1.21.1, :neoforge-1.21.1 modules are NOT listed here.
// They require Gradle 8.10 (ModDevGradle + Loom 1.7), while the legacy modules above use
// ForgeGradle 5.1 / Loom 1.1.9 which are pinned to Gradle 7. Build those via
// ./gradlew-1.21.1 which uses settings-1.21.1.gradle and the wrapper under gradle-1.21.1/.
