pluginManagement {
    // mcdp (MC Dependency Provider) is consumed from Maven Central / Sonatype Central
    // Portal snapshots — no sibling checkout / composite-include needed. The Gradle plugin
    // (`de.lhns.mcdp`) is resolved here; the runtime artifact (`de.lhns.mcdp:mcdp`) is
    // declared per-subproject in 1.21.1/{fabric,neoforge}/build.gradle.
    repositories {
        gradlePluginPortal()
        maven {
            name = 'FabricMC'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        // mcdp's Gradle plugin is published to Maven Central, not the Plugin Portal.
        mavenCentral()
        // Sonatype Central Portal snapshots — kept alongside mavenCentral so `mcdp_version`
        // in root gradle.properties can flip between release (e.g. `0.1.2`) and snapshot
        // (e.g. `0.1.3-SNAPSHOT`) without repo edits.
        maven {
            name = 'sonatype-central-snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }

    // Pin the de.lhns.mcdp plugin version centrally so the root `plugins {}` block in
    // build.gradle can reference it with `id 'de.lhns.mcdp'` (no `version` arg — Gradle's
    // plugins{} doesn't allow ${...} interpolation in version strings, but
    // pluginManagement.plugins resolves the same property without that restriction).
    plugins {
        id 'de.lhns.mcdp' version "${mcdp_version}"
    }
}

rootProject.name = 'mc-blockshifter'

// Old Fabric subprojects pin Loom 1.1.9, which collides at runtime with the
// Loom 1.7.x required by 1.21.1. Re-enable after migrating these to Loom 1.7+
// (or split into a composite build).
